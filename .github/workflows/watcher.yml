name: QQQ watcher

on:
  # Triggered externally by cron-job.org (workflow_dispatch API). The script skips runs outside market hours.
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside market hours"
        type: boolean
        default: false

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium system libs (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - name: Write config and session from secrets
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          TV_SESSION: ${{ secrets.TV_SESSION }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          printf '%s' "$TV_SESSION" > session.json
          [ -s config.json ] || { echo "::error::Secret CONFIG_JSON is empty or missing"; exit 1; }
          [ -s session.json ] || { echo "::error::Secret TV_SESSION is empty or missing"; exit 1; }
          python -c "import json; json.load(open('config.json'))" || { echo "::error::CONFIG_JSON is not valid JSON"; exit 1; }
          python -c "import json; json.load(open('session.json'))" || { echo "::error::TV_SESSION is not valid JSON"; exit 1; }

      - name: Check chart once
        run: xvfb-run -a python -u watcher.py --once ${{ inputs.force && '--force' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: watcher-state-${{ github.run_id }}

      - name: Upload screenshot on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug.png
          if-no-files-found: ignore
          retention-days: 3
